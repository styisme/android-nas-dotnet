name: Android CI

on:
  push:
    branches: [ "net10-maui", "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools' }

      - name: Install workloads
        run: dotnet workload install android maui-android

      - name: Sync Version
        run: python3 sync_version.py

      - name: Publish NAS Server App
        run: |
          dotnet publish src/AndroidNas.App/AndroidNas.App.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -p:RuntimeIdentifier=android-arm64

      - name: Publish NAS Client App
        run: |
          dotnet publish src/AndroidNas.Client/AndroidNas.Client.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -p:RuntimeIdentifier=android-arm64

      - name: Upload Server APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-Server-APK
          path: src/AndroidNas.App/bin/Release/net10.0-android/android-arm64/*.apk

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-Client-APK
          path: src/AndroidNas.Client/bin/Release/net10.0-android/android-arm64/*.apk

  build-desktop-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Install workloads
        run: dotnet workload install android maui-android
      - name: Sync Version
        run: python3 sync_version.py

      - name: Publish CLI
        run: dotnet publish src/AndroidNas.Cli/AndroidNas.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true

      - name: Publish Desktop
        run: dotnet publish src/AndroidNas.Desktop/AndroidNas.Desktop.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-CLI-linux
          path: src/AndroidNas.Cli/bin/Release/net10.0/linux-x64/publish/*

      - name: Upload Desktop
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-Desktop-linux
          path: src/AndroidNas.Desktop/bin/Release/net10.0/linux-x64/publish/*
