name: Android CI

on:
  push:
    branches: [ "net10-maui", "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools' }
      - name: Install workloads
        run: dotnet workload install android maui-android
      - name: Sync Version
        run: python3 sync_version.py

      - name: Publish Server APK
        run: dotnet publish src/AndroidNas.App/AndroidNas.App.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -p:RuntimeIdentifier=android-arm64
      - name: Publish Client APK
        run: dotnet publish src/AndroidNas.Client/AndroidNas.Client.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -p:RuntimeIdentifier=android-arm64
      - name: Publish TV APK
        run: dotnet publish src/AndroidNas.TV/AndroidNas.TV.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -p:RuntimeIdentifier=android-arm64
      - name: Publish Watch APK
        run: dotnet publish src/AndroidNas.Watch/AndroidNas.Watch.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -p:RuntimeIdentifier=android-arm64

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-Android-Apps
          path: |
            src/AndroidNas.App/bin/Release/net10.0-android/android-arm64/*.apk
            src/AndroidNas.Client/bin/Release/net10.0-android/android-arm64/*.apk
            src/AndroidNas.TV/bin/Release/net10.0-android/android-arm64/*.apk
            src/AndroidNas.Watch/bin/Release/net10.0-android/android-arm64/*.apk

  build-pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Install workloads
        run: dotnet workload install android maui-android
      - name: Sync Version
        run: python3 sync_version.py

      - name: Publish DesktopServer
        run: dotnet publish src/AndroidNas.DesktopServer/AndroidNas.DesktopServer.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:TargetFrameworks=net10.0
      - name: Publish DesktopClient
        run: dotnet publish src/AndroidNas.DesktopClient/AndroidNas.DesktopClient.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:TargetFrameworks=net10.0

      - name: Upload PC Apps
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-PC-Linux
          path: |
            src/AndroidNas.DesktopServer/bin/Release/net10.0/linux-x64/publish/*
            src/AndroidNas.DesktopClient/bin/Release/net10.0/linux-x64/publish/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Install workloads
        run: dotnet workload install android maui-android
      - name: Sync Version
        run: python sync_version.py

      - name: Publish DesktopServer
        run: dotnet publish src/AndroidNas.DesktopServer/AndroidNas.DesktopServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:TargetFrameworks=net10.0
      - name: Publish DesktopClient
        run: dotnet publish src/AndroidNas.DesktopClient/AndroidNas.DesktopClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:TargetFrameworks=net10.0

      - name: Upload Windows Apps
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-PC-Windows
          path: |
            src/AndroidNas.DesktopServer/bin/Release/net10.0/win-x64/publish/*.exe
            src/AndroidNas.DesktopClient/bin/Release/net10.0/win-x64/publish/*.exe
