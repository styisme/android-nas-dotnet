name: Android CI

on:
  push:
    branches: [ "net10-maui", "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "net10-maui", "main", "master" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-android:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install workloads
        run: |
          dotnet workload install android maui-android --skip-sign-check --skip-manifest-update
          dotnet workload list

      - name: Create solution
        run: |
          dotnet new sln -n AndroidNas || true
          dotnet sln add src/AndroidNas.Core src/AndroidNas.Server src/AndroidNas.App || true

      - name: Restore
        run: dotnet restore

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ runner.temp }}/nas.keystore
          echo "KEYSTORE_PATH=${{ runner.temp }}/nas.keystore" >> $GITHUB_ENV

      - name: Publish (signed)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          dotnet publish src/AndroidNas.App/AndroidNas.App.csproj \
            -c Release -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:RunAOTCompilation=false \
            -p:AndroidEnableProfiledAot=true \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=${{ env.KEYSTORE_PATH }} \
            -p:AndroidSigningStorePass=${{ env.KEYSTORE_PASS }} \
            -p:AndroidSigningKeyAlias=${{ env.KEY_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ env.KEY_PASS }}

      - name: Publish (debug signed)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          dotnet publish src/AndroidNas.App/AndroidNas.App.csproj \
            -c Release -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:RunAOTCompilation=false \
            -p:AndroidEnableProfiledAot=true

      - name: Locate APK
        id: apk
        run: |
          APK=$(find src/AndroidNas.App/bin/Release/net10.0-android -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find src/AndroidNas.App/bin/Release/net10.0-android -name "*.apk" | head -n 1)
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename "$APK")" >> $GITHUB_OUTPUT
          echo "size=$(du -h "$APK" | cut -f1)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-${{ github.run_number }}-${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
