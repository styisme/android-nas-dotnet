name: Android CI

on:
  push:
    branches: [ "net10-maui", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [App, Client, TV, Watch]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools' }
      - name: Install workloads
        run: dotnet workload install android maui-android
      - name: Sync Version
        run: python3 sync_version.py

      - name: Publish ${{ matrix.app }} APK
        run: |
          dotnet publish src/AndroidNas.${{ matrix.app }}/AndroidNas.${{ matrix.app }}.csproj \
            -c Release -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:RuntimeIdentifier=android-arm64

      - name: Upload ${{ matrix.app }} APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-${{ matrix.app }}-APK
          path: src/AndroidNas.${{ matrix.app }}/bin/Release/net10.0-android/android-arm64/*.apk

  build-pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Install workloads
        run: dotnet workload install android maui-android
      - name: Sync Version
        run: python3 sync_version.py

      - name: Publish DesktopServer
        run: dotnet publish src/AndroidNas.DesktopServer/AndroidNas.DesktopServer.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:TargetFrameworks=net10.0
      - name: Publish DesktopClient
        run: dotnet publish src/AndroidNas.DesktopClient/AndroidNas.DesktopClient.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:TargetFrameworks=net10.0

      - name: Upload PC Apps
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-PC-Linux
          path: |
            src/AndroidNas.DesktopServer/bin/Release/net10.0/linux-x64/publish/*
            src/AndroidNas.DesktopClient/bin/Release/net10.0/linux-x64/publish/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Install workloads
        run: dotnet workload install android maui-android
      - name: Sync Version
        run: python sync_version.py

      - name: Publish DesktopServer
        run: dotnet publish src/AndroidNas.DesktopServer/AndroidNas.DesktopServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:TargetFrameworks=net10.0
      - name: Publish DesktopClient
        run: dotnet publish src/AndroidNas.DesktopClient/AndroidNas.DesktopClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:TargetFrameworks=net10.0

      - name: Upload Windows Apps
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNas-PC-Windows
          path: |
            src/AndroidNas.DesktopServer/bin/Release/net10.0/win-x64/publish/*.exe
            src/AndroidNas.DesktopClient/bin/Release/net10.0/win-x64/publish/*.exe

  auto-release:
    needs: [build-android, build-pc, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and Create Tag
        id: check_tag
        run: |
          VERSION=$(python3 -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read()
          match = re.search(r'## \[(.*?)\]', text)
          print(match.group(1) if match else '')
          ")
          
          if [ -z "$VERSION" ]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "当前最新版本号: v$VERSION"
          
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION 已存在，跳过自动发版。"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "发现新版本 v$VERSION，准备自动打标签！"
            echo "skip_release=false" >> $GITHUB_OUTPUT
            echo "version=v$VERSION" >> $GITHUB_OUTPUT
            
            git config user.name "GitHub Action"
            git config user.email "action@github.com"
            git tag -a "v$VERSION" -m "Auto Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check_tag.outputs.skip_release == 'false'
        with:
          path: artifacts

      - name: Prepare Standalone Files
        if: steps.check_tag.outputs.skip_release == 'false'
        run: |
          mkdir -p release_files
          
          # 核心修复：使用 find 强行挖掘出所有文件，不管层级有多深
          find artifacts -name "*.apk" | grep "AndroidNas-App-APK" | head -n 1 | xargs -I {} cp {} release_files/AndroidNas-Server-App.apk
          find artifacts -name "*.apk" | grep "AndroidNas-Client-APK" | head -n 1 | xargs -I {} cp {} release_files/AndroidNas-Client-App.apk
          find artifacts -name "*.apk" | grep "AndroidNas-TV-APK" | head -n 1 | xargs -I {} cp {} release_files/AndroidNas-TV-App.apk
          find artifacts -name "*.apk" | grep "AndroidNas-Watch-APK" | head -n 1 | xargs -I {} cp {} release_files/AndroidNas-Watch-App.apk
          
          # 挖掘 Windows exe
          find artifacts -name "AndroidNas.DesktopServer.exe" | head -n 1 | xargs -I {} cp {} release_files/AndroidNas-DesktopServer-Windows.exe
          find artifacts -name "AndroidNas.DesktopClient.exe" | head -n 1 | xargs -I {} cp {} release_files/AndroidNas-DesktopClient-Windows.exe
          
          # 挖掘 Linux 单文件
          find artifacts -name "AndroidNas.DesktopServer" | head -n 1 | xargs -I {} cp {} release_files/AndroidNas-DesktopServer-Linux
          find artifacts -name "AndroidNas.DesktopClient" | head -n 1 | xargs -I {} cp {} release_files/AndroidNas-DesktopClient-Linux

          echo "===== 检查最终提取的文件列表 ====="
          ls -la release_files/

      - name: Extract Release Notes
        if: steps.check_tag.outputs.skip_release == 'false'
        run: |
          python3 -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read()
          match = re.search(r'## \[.*?\n(.*?)(?=\n## \[|\Z)', text, re.DOTALL)
          if match:
              with open('release_notes.md', 'w', encoding='utf-8') as f:
                  f.write(match.group(1).strip())
          "

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.version }}
          files: release_files/*
          body_path: release_notes.md
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
